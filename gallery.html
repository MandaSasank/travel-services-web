<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Gallery</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>

<body>
<header class="site-header">
  <h1>Travel Gallery</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="places.html">Places</a>
    <a href="packages.html">Packages</a>
    <a href="travel.html">Travel Options</a>

      <img class="gallery-image" src="images/place2.jpg" alt="Scenic travel destination">
      <img class="gallery-image" src="images/travel1.jpg" alt="Travel service destination">

<footer>
  <p>Gallery lightbox is created dynamically using JavaScript.</p>
</footer>
